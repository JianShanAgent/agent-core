# chat 插件：没有命中命令的消息走这里（闲聊、自然语言查 wiki）
# 需要 core.llm.yaml 的 enabled 为 true
enabled: true
# 查证工作流（research 插件）可用时，对话模型只负责判断这句话要不要查资料：
# 闲聊直接回，涉及 wiki 内容的问题交给工作流（research 工具），结论由工作流直接发给用户。
# 这时除了 research，只再给模型下面点名的工具，其余查资料的活都归工作流。
#   memory_*   ：记住 / 忘掉关于用户的事
# 站点插件另有该留给模型的工具时，在它配置的 extend 段里加进这个名单
# （阴阳师的 wiki_filter：按稀有度、标签列式神名单——知识库检索列不全名单，所以留着）。
# 查证工作流不可用（没有数据库）时这一项不起作用，模型用全部工具自己查。
tools_with_research: [memory_save, memory_forget_all]
# 告诉对话模型「什么问题该查、怎么查」的几段话。什么算这个 wiki 的内容因站而异，所以放在配置里：
# 这里是对什么 wiki 都说得通的说法，站点插件在它配置的 extend 段里换成那个站的（阴阳师的在 site.huiji_yys）。
# 每段是一句连着的话；某一项删掉就用代码里同样的默认说法。
prompts:
  # 没有查证工作流时：让模型自己用工具查
  facts: "涉及 wiki 收录的内容必须先用工具查 wiki，以工具结果为准，不要凭记忆回答；工具查不到就直说没查到。"
  # 有查证工作流时：模型只判断要不要查
  facts_research: "涉及 wiki 收录的内容的问题，一律立刻调用 research 工具：你不需要分析问题、不需要自己想答案，也不要猜题意、不要凭记忆回答、不要自己写链接。拿不准是不是在问 wiki 上的内容时（出现了你不认识的名字、外号、简称），也调用 research，不要反问用户。闲聊、打招呼、问你是谁，直接回复。"
  # 有查证工作流、而且这条消息带了图片时另加的一段
  images_research: "用户这条消息带了图片。如果是在问图里是什么、是谁、出自哪里，或者只发了图片没有说话：调用 research，图片会一并交给它做以图搜图；你自己不要凭印象认。这时 context 里只写图片上看得见的文字和客观内容（颜色、物件、界面上的字），不要猜名字。"
  # research 工具的说明（模型凭它决定调不调）
  research_description: "查证 wiki 相关的问题，并把结论直接回复给用户。凡是涉及 wiki 收录的内容的问题都必须调用它，不要凭记忆回答。用户的原话会原样交给它，它依次查 wiki 知识库、站内搜索（必要时联网），核对无误后把结论发给用户；调用以后你不用再回复。一条消息只调用一次。"
# 对话模型一次调用最多等多久（平时 2～10 秒，实测偶尔会卡一两分钟或者什么都不返回）。
# 第一轮就超时、又有查证工作流时，不再等它判断，直接把问题交给查证；其它情况回「有点忙」。0 = 不限
entry_timeout_seconds: 30
max_tool_rounds: 4               # 一条消息里模型最多连续调用几轮工具
max_tool_calls_per_round: 3      # 一轮里最多执行几个工具调用，多出来的不执行（模型偶尔会一口气发出上百个）
tool_result_chars: 16000         # 一次工具结果最多给模型多少字
# 历史里（不是当前这条消息）的工具结果只带回这么多字，后面的省略；需要细节时模型会重新查。
# 不截的话每条消息都要带上前几轮查到的全部原文，又慢又费额度。0 = 不截
history_tool_result_chars: 600
# 回复里出现、但没有查到过的链接一律去掉（模型会编假链接）；这一步是程序核对的，没有开关。
persona: persona.default         # 对应 config/persona/<名字>.yaml
markdown: true                   # 回复用 Markdown 发；发送失败会自动退回纯文本
# 用户发来的图片：下载后缩小（长边 1024 的 JPEG）给对话模型看；有查证工作流时，原图一并交给它做以图搜图。
# 取不到的图（下载失败、太大、超时、不是图片）当成没有，只在文字里告诉模型，这条消息照常处理。
# 只下载 https 地址，不连内网地址（见 core/media.py）。
images:
  max_per_message: 2             # 一条消息最多看前几张，多出来的不下载（一张图约占 1000 个输入 token）；0 = 不看图片
  max_megabytes: 10              # 单张图片最多下载多少 MB，超过的当成没取到
  timeout_seconds: 10            # 一张图片最多下多久（含跳转），超时当成没取到
commands:
  reset: "新话题"                # /新话题：删除自己的对话历史，重新开始（记住的事不受影响）
