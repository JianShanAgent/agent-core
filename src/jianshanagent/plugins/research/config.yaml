# research 插件：查证工作流。对话模型判断一句话需要查资料时把问题交给它，它的结论直接发给用户。
# 顺序、升级和打回都是程序定死的，模型只负责分析问题、判断资料够不够、写结论、复核结论：
#   0. 先弄明白问题：归类、摘出里面的名字去 wiki 数据里查别名（阴阳师 wiki：「小小白」→ 白童子）、
#      把「今年」「上个月」换成具体时间；用户发了图片就先以图搜图。查到的对照关系检索和作答时都用，
#      点到名的条目还会先把它自己页面里的内容取来。
#   1. 按 stages 的顺序逐级取证。先查第一级（知识库和站内搜索一起查）；查证员看资料够不够——够就写结论，
#      不够就给出搜索词、升级到下一级。资料逐级累加，前面查到的不丢。
#   2. 结论交给复核员：对着问题和全部资料逐句核对。通过就发；
#      不通过就带着理由打回给查证员，由它改写，或者接着升级取证。
#   3. 被打回、但已经没法再走一轮（超过 max_rejections 次，或者已经花了超过 max_seconds）：
#      按复核意见只改被点名的地方，改完直接发；改不出来才如实说没查到确切信息。
# 需要 core.llm.yaml 启用、知识库可用（要有数据库）；缺了就不生效，chat 插件退回让模型自己用工具查。
enabled: true

profiles:                          # 各个角色用 core.llm.yaml 里的哪一档模型
  analysis: quick                  # 分析问题（归类、摘名字、换算时间）：不开思考，要快
  # 查证员（判断资料够不够、决定要不要升级、写结论）和复核员（只判对错、指出问题，不改写）：都用不开思考的 quick 档。
  # 2026-11-11 用 60 题各比了两遍：开不开思考，答对的题数分不出高下（同一种配法跑两次都能差 3 题），
  # 用时差得多——都开思考时中位数 19 秒、有 6 题超过 1 分钟；都不开时中位数 10 秒、最慢 35 秒。
  # 想换回开思考：analyst 改成 reason、reviewer 改成 review（core.llm.yaml 里这两档还留着）。
  analyst: quick
  reviewer: quick
  # 不开思考、要快的一档，两个用处：查证员 / 复核员配成带思考的档位时，那次调用没成（思考把额度用光、超时）就用它再做一次；
  # 没法再走一轮时用它按复核意见修正。删掉这一项 = 这两件事都不做（前者算失败，后者直接说没查到）
  quick: quick
# 时间上的三道限制。模型接口忙的时候个别请求会卡一两分钟（实测 60 题里最慢的一题因此拖到 8 分钟），不能让用户跟着等：
think_timeout_seconds: 75          # 查证员 / 复核员配成带思考的档位时，一次调用最多等这么久（平时 5～40 秒），超过了改用 quick 档再做一次
# quick 档的调用最多等这么久。原来是 30：那时一题的资料只有八千字，一次调用几秒。现在挑中的页面给整页（见 whole_page），
# 一题平均三万多字、最多十几万字，平时一次要 5～20 秒；2026-11-11 晚上接口慢的那几分钟，64 题里有 14 题
# 就是查证员这一次超过 30 秒、整题失败（用户看到「我这会儿有点忙」），另有 9 题三四十秒才答出来。
quick_timeout_seconds: 60
# 查证员配的是 quick 档时（现在就是），它那次调用超时了原样再问几次。这一步做不成整个查证就失败，
# 而超时常常只是那一个请求卡住了。被打回后重写的那一次不重试：手里已经有一版结论，按复核意见修正它。0 = 不重试
quick_retries: 1
deadline_seconds: 240              # 整个查证的最后期限，各次调用的限时都不会越过它。群聊里平台只给 5 分钟回复，要留出对话入口和发消息的时间

# 第 0 步：分析问题
analysis:
  enabled: true                    # false = 不分析，按用户的原话查
  timeout_seconds: 10              # 分析或查别名超过这么久就不等了，按原话查（平时 1～4 秒）
  max_names: 5                     # 一个问题里最多查几个名字的别名
  # 点到名、在 wiki 上确实有的条目（站点插件认得的条目、页面）：从它自己的页面里挑和问题最接近的几片，排在资料最前面
  entry_chunks_per_name: 2         # 每个条目最多几片
  entry_chunks: 4                  # 一个问题合计最多几片
  # topics：问题归哪一类（告诉查证员，也记进日志，方便以后看用户都在问什么）。因站而异，由站点插件给
  # （阴阳师的在 site.huiji_yys 的 extend 段）；都没写时是：人物、事物、事件、规则机制、其它

# 提示词里因站而异的说法。这里是对什么 wiki 都说得通的；站点插件在自己配置的 extend 段里换成那个站的
# （阴阳师的在 site.huiji_yys）。这个 wiki 叫什么不在这里，在 core.wiki.yaml 的 name / about
wording:
  names: "条目、人物、事物、事件的名字或别称"   # 分析问题时要从问题里摘出来的名字都有哪些
  generic_words: []                # 泛指的词，不算名字（阴阳师：式神、活动、皮肤）
  facts: "数值、日期、名字、引文"      # 回答里必须能在资料里找到原话的事实都有哪些（写给查证员和复核员）
  mixups: "别的年份 / 别的对象"       # 容易张冠李戴的是什么（「不要把……的内容安到问的对象上」）
  analyst_note: ""                 # 这个站特有的提醒，接在查证员「不要张冠李戴」那一条后面；空 = 没有
  reviewer_note: ""                # 同上，给复核员的
  keyword_nouns: ""                # 站内搜索的搜索词优先用哪些专有名词（阴阳师：式神名、活动名……）；空 = 不说
  keyword_example: ""              # 站内搜索的搜索词举一个例子；空 = 不举

# 用户发了图片时的以图搜图（图库和相似度阈值在 plugin.knowledge）
images:
  max_images: 2                    # 一条消息最多拿几张图去搜

# 取证的级别和先后。写了但用不了的来源自动跳过：
#   kb   知识库（向量 + 关键词，参数在 plugin.knowledge）
#   site wiki 的站内全文搜索：用搜索词找到页面，再从这些页面的本地切片里挑和问题最接近的几片
#   web  联网搜索（core.websearch.yaml，按次计费）：用查证员给的搜索词在网上搜一次。搜到的不是 wiki 的内容，
#        查证员只在别的资料答不了时才用，回答里会说明是网上搜到的。网页的链接发不出去（QQ 平台只让发报备过的域名，
#        带了别的链接整条消息都会被拒），所以回答后面的参考资料里，网页只列标题和网站名
# 一级可以写一个来源，也可以用方括号写一组：一组里的来源一次查完才交给查证员，省掉「查证员说资料不够 → 再搜 → 再看一遍」
# 那一轮（一轮要多一次模型调用）。站内搜索放在第一级时，搜索词用第 0 步分析问题时挑的（外号已换成正式名）；
# 单独成一级时，用查证员看过资料以后给的。同一个来源可以出现在不止一级里。几种写法：
#   [[kb, site], web]        知识库和站内搜索一起查，还不够就联网搜索（联网搜索关掉时，查证员只看一遍资料就作答）
#   [kb, site, web]          先只查知识库，查证员说不够再站内搜索，还不够再联网
#   [[kb, site], site, web]  一起查；查证员说不够时，再用它给的词站内搜索一次
stages: [[kb, site], web]
site:
  pages: 5                         # 取站内搜索的前几个页面
  chunks: 6                        # 从这些页面里最多取几片
  timeout_seconds: 5               # 站内搜索最多等这么久，超时或出错就当这一级没查到
# 联网搜索的搜索词里没有这个 wiki 的名字（core.wiki.yaml 的 name）就自动加在前面：
# 光搜「永生之海」搜到的多半不是阴阳师的内容。要加别的词，在这里写 web: {topic: "…"}

# 把挑中的页面补成整页（用户 2026-11-11 定）。页面入库时按长度切成了段，各级取证只挑和问题最接近的几段；
# 名单这类占好几段的内容就会缺一块，而模型看不出后面还有（问「六星鬼王分别有哪些」，名单占 6 段、
# 挑中 5 段，答出来少一个）。每一级查完以后，把挑中的段所在的页面从知识库里补齐，整页按原来的先后排在一起。
# mode 三选一：
#   full     全量：挑中的页面一律给整页，不管挑中了几段、页面有多长。给模型的资料会多很多
#            （阴阳师 wiki 的式神页、图鉴页一页就有两三万字），要把下面的 evidence_chars 放大，否则放不下的页面补不进来。
#   excerpt  节选（不写 mode 时的默认）：一个页面挑中 min_hits 段以上、整页不超过 max_chars 字才给整页；
#            太长的页面只把挑中的那一节补成整节，一节也超过就不补。
#   off      不补，只给挑中的那几段。
# 两种模式下，没补成整页（整节）的段都会标上「节选」，查证员据此说明名单可能不全。
whole_page:
  mode: full                       # 用户 2026-11-11 定：用全量（模型的上下文有 100 万 token，几万字不算什么）
  min_hits: 2                      # 只在 excerpt 模式下用：一个页面挑中几段以上才补
  max_chars: 8000                  # 只在 excerpt 模式下用：整页（整节）不超过这么多字才补（全站 98% 的页面在这个数以内）

max_rejections: 2                  # 复核最多打回几次
max_seconds: 100                   # 被打回时整个查证已经花了超过这么久，就不再让查证员重写一轮（见上面第 3 条）
answer_chars: 300                  # 要求查证员把回答控制在多少字以内（列清单的问题除外）。越长越慢，也越容易出错
max_citations: 5                   # 回答后面最多附几条参考资料
evidence_chars: 200000             # 给模型看的资料总字数上限，超了的不要（整页补不进来时宁可不补，不补一半）。
                                   # 全量模式下一题通常两三万字，碰上几个长页面会到十几万字；节选模式 24000 就够

# 查证要花几十秒：每到一个阶段给用户发一句进度，免得对方以为卡住了又问一遍。
# 单聊、群聊一样，都是单独的一条短消息（不用平台的流式接口：只有单聊有，而且发出去的字不能改）。
# 第一句进度引用提问的那条消息（让对方知道开始处理他的问题了），后面每句引用机器人自己的上一句，串成一串；
# 最后的结论再引用提问的那条——中间不反复给提问的人弹「有人回复你」的提醒。
# 平台限制一条消息最多回复几次（gateway.qq.yaml 的 reply.passive），最后一次留给结论，
# 所以单聊最多发 3 句、群聊最多 4 句，多出来的阶段不发。某一项删掉或留空就不发那一句。
# 每一句是在那个阶段开始时发的，会一直挂到下一句发出来为止，所以写的是「接下来这一段在干什么」：
# 检索本身只要一两秒，时间都花在模型看资料、写结论上。只要一两秒的阶段不单独报，名额留给「正在复核…」。
progress:
  analyze: "正在查资料、整理答案…"    # 第一句：分析问题、以图搜图、查知识库、写结论都算在里面。
                                   # 关掉 analysis 的话这一步不会走，要把这句挪到 kb 上
  image: ""                        # 以图搜图约 1 秒，不单独报
  kb: ""                           # 查知识库约 1 秒，不单独报
  site: "资料还不够，正在站内搜索补充…"   # 升到下一级：搜索不到 1 秒，之后是查证员拿着补到的资料重写。
                                   # 一级里有几个来源时只报第一个来源的那一句，所以站内搜索和知识库一起查时这句不会发
  web: "资料还不够，正在联网搜索补充…"
  review: "正在复核…"
  revise: "复核没通过，正在修正…"       # 被复核打回后查证员重写
  fix: ""                          # 按复核意见快速修正只要几秒，不单独报

# 各级取证的名字：写在资料上（让模型知道每条资料是从哪一级查到的），也用来告诉查证员下一级是什么
labels:
  image: 以图搜图
  kb: 知识库
  site: 站内搜索
  web: 联网搜索
