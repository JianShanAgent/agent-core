# chatlog 插件：把机器人在群里收到的消息、它自己的回复记进数据库（chat_messages 表），留着以后做分析、出日报。
# 只记录：机器人回答问题不读这些记录，消息内容也不进日志。没有数据库时不生效。
# 机器人的回复只记最终的那一条，「正在查资料…」这类进度不记。
# 用户发 /清除记忆（或者用自然语言要求删除他的信息）时，他的群聊记录一起删：他的发言、机器人对这些发言的回复；
# 别人的发言留着，但里面提到他的事件原文（被 @ 的人、被引用的消息）清空。
#
# 能收到哪些消息由 QQ 那边决定：群主在手机 QQ 里（那个群 → 点机器人头像 → 设置 →
# 「机器人可获取的群聊消息范围」）选了「获取群内全部消息」的群，每一条发言都会收到；
# 其余的群只收得到 @ 机器人的消息。不管哪种，机器人都只回复 @ 了它的消息。
enabled: true
scopes:
  - group                          # 记哪些会话：group = 群聊。单聊的对话历史另有 llm_messages 表，不在这里重复记
keep_days: 90                      # 记录留多少天，过了自动删（约每小时清一次）；0 = 一直留着
