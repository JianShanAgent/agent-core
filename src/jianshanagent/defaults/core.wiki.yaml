# 这个机器人服务的是哪些 wiki。查询（wiki_query）、知识库（knowledge）、提示词都从这里拿。
# 这里是默认值（一个 wiki 都没挂）：挂哪些 wiki 是每个部署自己的事，写在部署的 config/core.wiki.yaml 里。

name: ""                           # 这些 wiki 讲的是什么。提示词里用它：「你是 <name> wiki 机器人的查证员」
about: ""                          # 一句话说明它是什么，向模型交代背景时用；可以不写
user_agent: "JianShanAgent/0.1 (+https://github.com/JianShanAgent/agent-core)"   # 各个插件可以在自己的配置里另写

# 挂着的 wiki，一项一个。一般只有一个；同一个题材有好几个 wiki（各有各的长处）时可以都挂上：
# 知识库各建各的、一起检索，/查 各查各的，回答里标明出自哪个 wiki。
# 排第一的是主 wiki：对话、查证、记忆、人设这些只有一份的配置，用的是它的站点插件的补充；
# 后面的 wiki 的站点插件只管它自己的取数、清洗和查询。
# 这张名单不能在管理后台里改（它决定加载哪些代码、密钥发到哪里），要改就改部署的配置文件再发布。
wikis: []
# wikis:
#   - id: main                       # 它在这个部署里的名字（小写字母、数字、下划线）：知识库的目录名、库里切片的出处。
#                                    # 建了知识库以后不要改，改了等于换了一个 wiki
#     label: "示例 wiki"              # 回答里标出处时怎么称呼它；不写就用 id。只挂一个 wiki 时不标出处，可以不写
#     api_url: "https://wiki.example.org/api.php"   # MediaWiki 的接口地址（有的站是 <站点>/w/api.php）。必填
#     site_base: "https://wiki.example.org"         # 站点地址。不写就取 api_url 的域名
#     article_path: "/wiki/$1"       # 页面地址在站内的写法（MediaWiki 的 $wgArticlePath，$1 是标题）；不写就是 /wiki/$1
#     # 有的站在 Cloudflare 之类的后面，请求要带放行请求头才不会被挑战页拦截。
#     # 这里只写请求头名（如 X-authkey）；密钥在 secrets.yaml 的 wiki.<id>.authkey（不入库）。不需要放行的站不写
#     auth_header: ""
#     # 用哪个站点插件（规范见 docs/插件规范.md）。通用的代码只懂 MediaWiki，某个平台、某个站特有的东西由站点插件带进来。
#     # 站点插件是一棵树：平台在上，具体的站在它下面。这里只写最末一级的 id，上级顺着插件清单自动带出来
#     # （写 huiji_yys，灰机平台 huiji 会先加载）。站点插件是另外装的包（如 jianshanagent-site-huiji-yys）。
#     # 不写就是纯 MediaWiki：/查 只认页面标题和全文搜索，知识库只有条目页。
#     # 没登记的包写它的包路径（如 mypkg.mysite），装在同一个 Python 环境里就行。
#     site: ""
