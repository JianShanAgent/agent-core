# 处理记录：每条对机器人说的消息是怎么处理的——走了哪条路、每一步多久、调了几次模型、用了多少 token——
# 都落到数据库（traces、llm_calls 两张表）。管理后台的首页统计和「查证过程」从这里来。
# 没有数据库时不落库，只在内存里留最近几十条。
enabled: true
prompts:
  keep: true                       # 记不记每次模型调用的完整提示词和回复（排查「为什么这么答」时看）。图片不存，只留占位
  retention_days: 14               # 提示词和回复留多少天，过期清空（用量数字不受影响）；0 = 一直留着
# 处理记录本身留多少天，过期的连同它的模型调用一起删；0 = 一直留着。
# 记录里有用户问的话和机器人的回答，和群聊记录留一样久（plugin.chatlog 的 keep_days）。
# 首页的统计也是从这张表算的，所以最多能看到这么多天以内的
retention_days: 90
