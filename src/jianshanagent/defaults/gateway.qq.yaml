# QQ 官方机器人网关（qqbot-agent-sdk）。这份配置改了要重启才生效。
# 订阅哪些事件（群 @、群全部消息、单聊、按钮点击）由 SDK 固定，这里配不了；SDK 也没有沙盒环境的开关。
enabled: true            # false = 不连 QQ：进程照常起来，管理后台和网页对话能用，只是收不到也发不出 QQ 消息
reply:
  # 机器人只发被动回复（挂在用户的那条消息上），不主动发消息。
  # 用户的一条消息最多能回复几次（平台文档的数值；平台另外规定了时间窗：群聊 5 分钟、单聊 60 分钟，
  # 一条消息最长处理 4 分钟，够不着，所以没有做成配置）。
  # 处理中途发的进度消息（查证工作流每到一个阶段发一句）只在还有富余名额时发，
  # 最后一次留给最终回复——单聊最多 3 句进度，群聊最多 4 句，多出来的不发。
  passive:
    c2c_max_replies: 4
    group_max_replies: 5
# 进程退出时（每次发布、重启都会）：先不再收新消息，正在处理的消息最多等这么久让它们答完；
# 到点还没答完的，回一句「机器人正在重启，请过一会儿再问一次」。原来是直接退出，
# 对方看到「正在查资料…」之后就再没有下文。容器给进程 30 秒退出（deploy/docker-compose.yml 的
# stop_grace_period），这里要比它小，留出存记录、关数据库的时间。0 = 不等，直接回那一句
shutdown:
  drain_seconds: 20
session_store_dir: /data/qq_ws
