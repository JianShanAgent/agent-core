# 核心的更新：定时看主仓库有没有发新版本，管理后台「系统信息」页里显示出来，点一下就更新并重启。
#
# 点「更新」做的事：从主仓库的 Release 下载那个版本的安装包，核对校验和，解到数据目录下
# （data/core/versions/<版本>/，容器里是 /data/core），记成「待确认」，然后原地重启。
# 新版本启动完成才算数；起不来就自动退回原来的版本。环境里装的那一份不动。
# 做法和各种情况怎么处理见 src/jianshanagent/_bootstrap.py、src/jianshanagent/core/update.py。
#
# 只在这两种情况下能点更新，别的只提示有新版本：
#   - 新版本要的第三方依赖和环境里装的一样（依赖变了要重建环境，页面上会说明怎么做）；
#   - 核心是装成包运行的。从源码运行（可编辑安装）、按发布流程部署到服务器的（./release）不在程序里更新。
enabled: true                     # false = 不查新版本，后台里也不提示

# 从哪里查、从哪里下。这几项不能在管理后台里改：它们决定机器人去下载并运行谁的代码。
repo: "JianShanAgent/agent-core"  # 主仓库（GitHub 上的 <组织>/<仓库>）
api_url: "https://api.github.com" # GitHub 的接口地址
# 下载安装包时加在下载地址前面的镜像前缀（访问 github.com 慢的机器用，例如某个 GitHub 加速服务的地址，
# 以 / 结尾）。校验和取自 api_url 那边，镜像给的文件对不上就不装。不用镜像就留空。
download_prefix: ""

check_interval_hours: 6           # 每隔多久查一次（最少 1 小时）。启动后过一会儿先查一次
timeout_seconds: 15               # 查一次、下载一次各自最多等多久
