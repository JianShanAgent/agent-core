# 联网搜索：模力方舟的「互联网搜索接口」（POST {base_url}/web-search）。
# 按次计费，每次 0.04 元，和要几条结果无关（2026-11 的价格）。密钥和嵌入用的是同一个，不用另外申请。
#
# 现在只有查证工作流用它：plugin.research 的 stages 里的 web 那一级。
# 前面几级（知识库、站内搜索）的资料答不了，查证员才会走到这一级，所以不是每个问题都搜。
# 关掉、或者密钥没填时，那一级自动跳过。
#
# 没有用 MiMo 自带的联网搜索：它要另开「联网服务插件」，我们用的 Token Plan 密钥调用时报 webSearchEnabled is false。
#
# 现在关着（用户 2026-11-11 定：代码先上线，联网先不开）。改成 true 就生效，不用动别的。
enabled: false

base_url: "https://ai.gitee.com/v1"
secret: "gitee_ai"                # 密钥在 secrets.yaml 的哪一项下（取它的 api_key）

count: 6                          # 一次要几个网页（1–50）。价格和个数无关；多了查证员要读的字也多
summary: true                     # 要不要网页内容的摘要（几百字）。关掉就只有搜索结果里那一两句话
page_chars: 1200                  # 一个网页的摘要最多留多少字，超出的截掉
freshness: "noLimit"              # 只要多久以内的网页：noLimit 不限 / oneDay / oneWeek / oneMonth / oneYear

timeout_seconds: 10               # 一次搜索最多等这么久（实测约 1 秒）；超时或出错就当这一级没查到
max_retries: 1                    # 网络错误、限流、接口故障时再试几次
