[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jianshanagent"
version = "0.2.0"
description = "JianShanAgent（见山）核心：给 MediaWiki 站点用的 QQ 问答机器人"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "JianShanAgent" }]
dependencies = [
  "qqbot-agent-sdk>=1.2.2",
  "aiohttp>=3.9",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "structlog>=24.1",
  "redis>=5.0",
  "asyncpg>=0.29",
  "tenacity>=8.3",
  "lxml>=6.1.3",
  "pillow>=11.0",
]

[project.optional-dependencies]
brain = [
  "langgraph>=0.2",
  "langchain-openai>=0.2",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
jianshanagent = "jianshanagent._bootstrap:launch"

[tool.hatch.build.targets.wheel]
packages = ["src/jianshanagent"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/jianshanagent",
  "/docs",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["jianshanagent"]

[[tool.mypy.overrides]]
module = ["qqbot_agent_sdk.*"]
ignore_missing_imports = true
